<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snack Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #1a1a21;
      --surface-hover: #22222c;
      --border: #2e2e3a;
      --text: #f0f0f5;
      --muted: #9494a8;
      --accent: #7c5cff;
      --accent-dim: rgba(124, 92, 255, 0.15);
      --success: #4ade80;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124, 92, 255, 0.25), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(124, 92, 255, 0.08), transparent);
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--muted);
      margin-top: 0.5rem;
      font-size: 0.95rem;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow);
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    input[type="password"],
    input[type="text"],
    textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      padding: 0.75rem 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .field + .field {
      margin-top: 1.25rem;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }

    button.primary {
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.9rem 1.25rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #7c5cff, #5b3fd4);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
    }

    button.primary:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button.primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .recipe-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      box-shadow: var(--shadow);
      animation: fadeUp 0.4s ease;
    }

    .recipe-card.visible {
      display: block;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .recipe-card h2 {
      font-size: 1.5rem;
      margin-bottom: 0.25rem;
      color: var(--success);
    }

    .recipe-card .tagline {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
    }

    .recipe-card ol {
      padding-left: 1.25rem;
    }

    .recipe-card li {
      margin-bottom: 0.65rem;
      padding-left: 0.35rem;
    }

    .recipe-card li::marker {
      color: var(--accent);
      font-weight: 600;
    }

    .status {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 1rem;
      min-height: 1.25rem;
    }

    .status.error {
      color: #f87171;
    }

    .spinner {
      display: inline-block;
      width: 1em;
      height: 1em;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: -0.15em;
      margin-right: 0.35rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🍿 Snack Generator</h1>
      <p>Turn whatever’s in your kitchen into a quick, fun snack recipe.</p>
    </header>

    <section class="panel" aria-label="Recipe inputs">
      <div class="field">
        <label for="apiKey">Gemini API key</label>
        <input type="password" id="apiKey" placeholder="Paste your API key" autocomplete="off" />
        <p class="hint">Stored only in this browser tab (sessionStorage).</p>
      </div>
      <div class="field">
        <label for="ingredients">Ingredients</label>
        <textarea id="ingredients" placeholder="eggs, cheese, tortillas"></textarea>
      </div>
      <button type="button" class="primary" id="generateBtn">Generate Recipe</button>
      <p class="status" id="status" role="status"></p>
    </section>

    <article class="recipe-card" id="recipeCard" aria-live="polite">
      <h2 id="recipeTitle"></h2>
      <p class="tagline" id="recipeTagline"></p>
      <ol id="recipeSteps"></ol>
    </article>
  </div>

  <script>
    const MODEL = "gemini-3.8-flash";
    const API_URL = (key) =>
      `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(key)}`;

    const apiKeyEl = document.getElementById("apiKey");
    const ingredientsEl = document.getElementById("ingredients");
    const generateBtn = document.getElementById("generateBtn");
    const statusEl = document.getElementById("status");
    const recipeCard = document.getElementById("recipeCard");
    const recipeTitle = document.getElementById("recipeTitle");
    const recipeTagline = document.getElementById("recipeTagline");
    const recipeSteps = document.getElementById("recipeSteps");

    const savedKey = sessionStorage.getItem("gemini_api_key");
    if (savedKey) apiKeyEl.value = savedKey;

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle("error", isError);
    }

    function setLoading(loading) {
      generateBtn.disabled = loading;
      setStatus(loading ? "" : statusEl.textContent);
      if (loading) {
        statusEl.classList.remove("error");
        statusEl.innerHTML = '<span class="spinner"></span> Cooking up ideas…';
      }
    }

    function renderRecipe(data) {
      recipeTitle.textContent = data.title || "Untitled Snack";
      recipeTagline.textContent = data.tagline || "";
      recipeSteps.innerHTML = "";
      (data.steps || []).forEach((step) => {
        const li = document.createElement("li");
        li.textContent = step;
        recipeSteps.appendChild(li);
      });
      recipeCard.classList.add("visible");
    }

    async function generateRecipe() {
      const key = apiKeyEl.value.trim();
      const ingredients = ingredientsEl.value.trim();

      if (!key) {
        setStatus("Add your Gemini API key first.", true);
        apiKeyEl.focus();
        return;
      }
      if (!ingredients) {
        setStatus("List at least one ingredient.", true);
        ingredientsEl.focus();
        return;
      }

      sessionStorage.setItem("gemini_api_key", key);
      setLoading(true);
      recipeCard.classList.remove("visible");

      const prompt = `You are a playful snack chef. Using ONLY these ingredients (pantry staples like salt, oil, pepper OK): ${ingredients}

Respond with ONLY valid JSON, no markdown fences:
{
  "title": "A fun, catchy snack name",
  "tagline": "One short witty line about the snack",
  "steps": ["Step 1...", "Step 2...", "..."]
}
Give 4–8 clear numbered-style steps as strings in the steps array.`;

      try {
        const res = await fetch(API_URL(key), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              temperature: 0.9,
              responseMimeType: "application/json",
            },
          }),
        });

        const json = await res.json();
        if (!res.ok) {
          const errMsg = json?.error?.message || `HTTP ${res.status}`;
          throw new Error(errMsg);
        }

        const text =
          json?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
        if (!text) throw new Error("Empty response from Gemini.");

        let recipe;
        try {
          recipe = JSON.parse(text);
        } catch {
          const match = text.match(/\{[\s\S]*\}/);
          if (!match) throw new Error("Could not parse recipe JSON.");
          recipe = JSON.parse(match[0]);
        }

        renderRecipe(recipe);
        setStatus("");
      } catch (err) {
        setStatus(err.message || "Something went wrong.", true);
      } finally {
        setLoading(false);
      }
    }

    generateBtn.addEventListener("click", generateRecipe);
    ingredientsEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) generateRecipe();
    });
  </script>
</body>
</html>
